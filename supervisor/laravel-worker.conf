[program:laravel-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /path/to/your/project/artisan queue:work --sleep=3 --tries=3 --timeout=300
autostart=true
autorestart=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/laravel-worker.log
stopsignal=QUIT

; Notes:
; - Replace /path/to/your/project with the full path to the Laravel project (e.g., /var/www/legalconnect)
; - Replace php with the full path to php binary if necessary (e.g., /usr/bin/php)
; - Replace user with the appropriate system user (www-data, ubuntu, etc.)
